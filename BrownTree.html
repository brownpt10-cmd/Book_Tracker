<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brown Family Archive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a home hub of trees, people and stories; each tree is an expandable outline; every person has a page */
:root{
  --bg:#fbfaf7;--paper:#fff;--fg:#1d2128;--muted:#5d6470;--line:#d8d5cc;
  --accent:#2f4a6d;--accent-soft:#e9eef5;--seal:#7a2e2a;--hover:#f3f1ec;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Source Sans 3",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--paper:#1b1f26;--fg:#e7e5df;--muted:#a0a6b0;--line:#343a46;--accent:#9db6d8;--accent-soft:#1f2836;--seal:#d99a92;--hover:#222731;color-scheme:dark}
  :root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"]{--bg:#14171c;--paper:#1b1f26;--fg:#e7e5df;--muted:#a0a6b0;--line:#343a46;--accent:#9db6d8;--accent-soft:#1f2836;--seal:#d99a92;--hover:#222731;color-scheme:dark}
:root[data-theme="dark"] .logo{filter:invert(1)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
.home img{width:30px;height:30px}
.crumbs{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs a{text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:block;width:72px;height:72px;margin:0 0 16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6vw,48px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:30px 0 10px}
.lede{color:var(--muted);max-width:64ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:var(--fg);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.tile:hover,.tile:focus-visible{border-color:var(--accent)}
.tile .t{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15}
.tile .s{font-size:14px;color:var(--muted);margin-top:2px}
.tile .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.search{width:100%;box-sizing:border-box;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--fg);margin-bottom:10px}
.plist{columns:2 240px;column-gap:24px;margin:0;padding:0;list-style:none}
.plist li{break-inside:avoid;padding:3px 0;font-size:15px}
.plist .y{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
/* tree outline */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;padding-left:16px;border-left:2px solid var(--line)}
.row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:5px 6px;border-radius:5px}
.row:hover{background:var(--hover)}
.tog{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--accent);cursor:pointer;font-size:12px;line-height:1;align-self:center;padding:0}
.tog[aria-expanded="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.tog.none{visibility:hidden}
.nm{font-weight:600;text-decoration:none;color:var(--fg)}
.nm:hover{color:var(--accent);text-decoration:underline}
.direct .nm{color:var(--accent)}
.yrs{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sp{font-size:14px;color:var(--muted)}
.sp a{color:var(--muted)}
.cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* person */
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:14px 0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.facts dt{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0;min-width:0}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rel .tile .t{font-size:18px}
.notes{margin:0;padding-left:20px}
.notes li{margin-bottom:6px;max-width:68ch}
.src{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:4px;padding:8px 10px;overflow-wrap:anywhere}
.story p{max-width:66ch}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal);border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
@media (max-width:480px){.facts{grid-template-columns:1fr;gap:0}.facts dt{padding-top:8px}.home span{display:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

 "stephen-hopkins":{name:"Stephen Hopkins",born:"c. 1581, England",died:"1644, Plymouth",notes:["Passenger on the Mayflower, which reached Plymouth in December 1620.","Before Plymouth he sailed for Jamestown in 1609 on the Sea Venture, which wrecked on Bermuda. He was sentenced to death there for mutiny and talked his way into a pardon. The wreck is thought to have inspired Shakespeare's The Tempest.","In Plymouth he served as a go-between with the Wampanoag and died a prosperous shopkeeper in 1644.","Generation 1 of the Mayflower line on Ruby (Brown) White's application."],src:"Mayflower Society application no. 8224 (1985). Years are the standard published dates."},

 "stephen-snow":{name:"Stephen Snow",born:"1636, Plymouth",died:"17 Dec 1705, Eastham",parents:["nicholas-snow","constance-hopkins"],spouse:["susanna-deane"],married:"28 Oct 1663, Eastham",notes:["Generation 3."],src:"FOP [Hopkins]. MD 3:168; 8:15; 15:51; 31:37. NEHGR 47:341, 342."},

 "hanna-myrick":{name:"Hanna Myrick",born:"1700",died:"17 Feb 1764, Harwich",src:"Application no. 8224."},
 "hanna-snow":{name:"Hanna Snow",born:"29 Oct 1725, Harwich, MA",died:"1761, Southeast, NY (Dutchess Co.)",parents:["john-snow","hanna-myrick"],spouse:["moody-howes"],married:"9 Feb 1748, Harwich",notes:["Generation 6. The family name passes from Snow to Howes here."],src:"Harwich VR, 36, 95, 108. Yarmouth VR, 52. NYGBR 58:277. Early Settlers of New York State (Foley), 4-6:380."},
 "moody-howes":{name:"Moody Howes",born:"18 Jul 1724, Yarmouth",died:"9 Apr 1806, Southeast, NY",parents:["thomas-howes-1700","deborah-sears"],notes:["Through his father he descends from Thomas Howes of Norfolk; through his grandmother Sarah Gorham, from John Howland and the Tilleys of the Mayflower.","Moved from Cape Cod to Southeast, Dutchess Co., NY, where he died."],src:"Application no. 8224; Howes genealogies; Yarmouth vital records.",story:"howes-england"},

 "deborah-sears":{name:"Deborah Sears",notes:["Of the Sears family of Yarmouth."],src:"WeRelate."},
 "ebenezer-howes":{name:"Capt. Ebenezer Howes",born:"16 Jan 1673/74, Yarmouth",died:"8 Jan 1726/27, Yarmouth",parents:["jeremiah-howes","sarah-prence"],spouse:["sarah-gorham"],married:"20 Apr 1699, Yarmouth",notes:["Militia captain; as youngest son he kept his father's homestead.","After Sarah died in 1705 he married Lydia Joyce (1706) and had seven more children."],src:"Yarmouth VR; minerdescent.com; sibertancestry.org."},

 "joseph-gorham":{name:"Ensign Joseph Gorham",born:"16 Feb 1652/53, Yarmouth",died:"1726, Yarmouth",parents:["john-gorham","desire-howland"],spouse:["sarah-sturgis"],notes:["Shoemaker and militia ensign in Yarmouth."],src:"minerdescent.com (Capt. John Gorham)."},

 "desire-howland":{name:"Desire Howland",born:"c. 1625, Plymouth",died:"1683, Barnstable",parents:["john-howland","elizabeth-tilley"],src:"Mayflower Families (Howland)."},

 "sarah-prence":{name:"Sarah Prence",born:"c. 1643, Duxbury",died:"31 Mar 1707, Yarmouth",parents:["thomas-prence","mary-collier"],src:"minerdescent.com."},

      t.group.members.map(m=>`<a class="nm" href="#p-${m}">${esc(P[m].name)}</a><span class="yrs">${yr(P[m].born)}</span>`).join('<span class="sp">·</span>')+`</div>`;
    if(isOpen) g += `<ul>${ks.map((k,i)=>rowHTML(t,k,depth+1,path+"."+i)).join("")}</ul>`;
    return g+"</li>";
  }
  const sp = t.mode==="descendants" ? spouses(id) : spouses(id).filter(s=>!parents(id).includes(s));
  const spTxt = sp.length ? `<span class="sp">m. ${sp.map(link).join(", ")}</span>` : "";
  const cnt = ks.length ? `<span class="cnt">${ks.length} ${t.mode==="ancestors"?(ks.length>1?"parents":"parent"):(ks.length>1?"children":"child")}</span>` : "";
  let h = `<li class="${DIRECT.has(id)?"direct":""}"><div class="row">`+
    `<button class="tog ${ks.length?"":"none"}" data-key="${key}" aria-expanded="${isOpen}" aria-label="${isOpen?"Collapse":"Expand"} ${esc(P[id].name)}">${isOpen?"−":"+"}</button>`+
    `<a class="nm" href="#p-${id}">${esc(P[id].name)}</a><span class="yrs">${yrs(id)}</span>${spTxt}${isOpen?"":cnt}</div>`;
  if(ks.length && isOpen) h += `<ul>${ks.map((k,i)=>rowHTML(t,k,depth+1,path+"."+i)).join("")}</ul>`;
  return h+"</li>";
}

  <div class="eyebrow">1620 – today · ${Object.keys(P).length} people · ${TREES.length} trees · ${STORIES.length} stories</div>
  <h1>Brown Family Archive</h1>
  <p class="lede">The Brown family and the lines that joined it: two Mayflower lines (Stephen Hopkins, and John Howland with the Tilleys), the Howeses of Norfolk, the Brownswords of Manchester and the Nelsons of Sweden. Open a tree and expand it a generation at a time, or open anyone's page.</p>
  <h2>Family trees</h2>
  <div class="grid">${TREES.map(t=>`<a class="tile" href="#tree-${t.id}"><div class="k">${t.mode==="ancestors"?"Ancestors":"Descendants"} of ${esc(rootName(t))}</div><div class="t">${esc(t.title)}</div><div class="s">${esc(t.sub)}</div></a>`).join("")}</div>
  <h2>Stories</h2>
  <div class="grid">${STORIES.map(s=>`<a class="tile" href="#story-${s.id}"><div class="k">${esc(P[s.person].name)}</div><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub)}</div></a>`).join("")}</div>
  <h2>Famous cousins</h2>
  <div class="grid">${Object.values(FAMOUS).map(f=>`<a class="tile" href="#tree-${f.tree}"><div class="k">${f.people.length} well-known cousins</div><div class="t">${esc(f.title)}</div><div class="s">Also descended from ${esc(f.via)}</div></a>`).join("")}</div>
  <h2>People</h2>
  <input class="search" id="q" type="search" placeholder="Find a person" aria-label="Find a person">
  <ul class="plist" id="plist">${people.map(id=>`<li data-n="${esc(P[id].name.toLowerCase())}">${link(id)}<span class="y">${yrs(id)}</span></li>`).join("")}</ul>
  <h2>Documents</h2>
  <div class="grid">${DOCS.map(d=>`<a class="tile" href="${d.url}" target="_blank" rel="noopener"><div class="k">Opens in a new tab</div><div class="t">${esc(d.title)}</div><div class="s">${esc(d.sub)}</div></a>`).join("")}</div>`;
  $("#q").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim(); document.querySelectorAll("#plist li").forEach(li=>li.hidden=q&&!li.dataset.n.includes(q));});
}

function viewTree(id){
  const t=TREES.find(x=>x.id===id); if(!t) return viewHome();
  lastTree=t; crumbs([esc(t.title)]);
  $("#app").innerHTML = `<div class="eyebrow">${t.mode==="ancestors"?"Ancestors":"Descendants"} of ${esc(rootName(t))}</div>
  <h1>${esc(t.title)}</h1><p class="lede">${esc(t.sub)} Tap + to open a generation; tap a name for that person's page. Blue names are direct ancestors.</p>
  <div class="tools"><button class="btn" id="ex">Expand all</button><button class="btn" id="co">Collapse all</button><a class="btn" href="#home" style="text-decoration:none">Home</a></div>
  <ul class="tree" id="tree">${rowHTML(t,t.root,0,"0")}</ul>${famousHTML(t.id)}`;
  $("#tree").addEventListener("click",e=>{const b=e.target.closest(".tog"); if(!b||b.classList.contains("none")) return; open[b.dataset.key]=b.getAttribute("aria-expanded")!=="true"; const y=scrollY; viewTree(id); scrollTo(0,y);});
  $("#ex").onclick=()=>{setAll(t,true);viewTree(id);}; $("#co").onclick=()=>{setAll(t,false);viewTree(id);};
}

function tiles(ids){ return ids.length ? `<div class="rel">${ids.map(k=>`<a class="tile" href="#p-${k}"><div class="t">${esc(P[k].name)}</div><div class="s">${yrs(k)||"&nbsp;"}</div></a>`).join("")}</div>` : `<p class="lede">None recorded yet.</p>`; }

function viewPerson(id){
  const p=P[id]; if(!p) return viewHome();
  crumbs([lastTree?`<a href="#tree-${lastTree.id}">${esc(lastTree.title)}</a>`:"",esc(p.name)].filter(Boolean));
  const sp=spouses(id), st=STORIES.filter(s=>s.person===id), inTrees=TREES.filter(t=>{const seen=new Set();(function w(x){seen.add(x);nodeKids(t,x).forEach(w)})(t.root);return seen.has(id)||(t.group&&t.group.members.includes(id));});
  $("#app").innerHTML = `<div class="eyebrow">${DIRECT.has(id)?"Direct ancestor line":"Family member"}</div>
  <h1>${esc(p.name)}</h1>
  <dl class="facts">
   ${p.born?`<dt>Born</dt><dd>${esc(p.born)}</dd>`:""}${p.died?`<dt>Died</dt><dd>${esc(p.died)}</dd>`:""}
   ${sp.length?`<dt>Married</dt><dd>${sp.map(link).join(", ")}${p.married?" · "+esc(p.married):""}</dd>`:""}
   ${parents(id).length?`<dt>Parents</dt><dd>${parents(id).map(link).join(" &amp; ")}</dd>`:""}
  </dl>
  ${p.notes&&p.notes.length?`<h2>Notes</h2><ul class="notes">${p.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
  ${st.length?`<h2>Stories</h2><div class="grid">${st.map(s=>`<a class="tile" href="#story-${s.id}"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub)}</div></a>`).join("")}</div>`:""}
  <h2>Children</h2>${tiles(kids(id))}
  ${siblings(id).length?`<h2>Brothers &amp; sisters</h2>${tiles(siblings(id))}`:""}
  ${FAMOUS_BY_PERSON[id]?famousHTML(FAMOUS_BY_PERSON[id]):""}
  ${p.src?`<h2>Sources</h2><div class="src">${esc(p.src)}</div>`:""}
  <h2>In these trees</h2><div class="tools">${inTrees.map(t=>`<a class="btn" style="text-decoration:none" href="#tree-${t.id}">${esc(t.title)}</a>`).join("")||'<span class="lede">Not in a tree yet.</span>'}<a class="btn" style="text-decoration:none" href="#home">Home</a></div>`;
}

function viewStory(id){
  const s=STORIES.find(x=>x.id===id); if(!s) return viewHome();
  crumbs(["Stories",esc(s.title)]);
  $("#app").innerHTML = `<div class="eyebrow">Story · ${link(s.person)}</div><h1>${esc(s.title)}</h1><p class="lede">${esc(s.sub)}</p>
  <div class="story">${s.body.map(b=>`<p>${esc(b)}</p>`).join("")}</div>
  <div class="tools"><a class="btn" style="text-decoration:none" href="#p-${s.person}">${esc(P[s.person].name)}'s page</a><a class="btn" style="text-decoration:none" href="#home">Home</a></div>`;
}

function route(){
  const h=location.hash.slice(1)||"home";
  if(h.startsWith("tree-")) viewTree(h.slice(5));
  else if(h.startsWith("p-")) viewPerson(h.slice(2));
  else if(h.startsWith("story-")) viewStory(h.slice(6));
  else viewHome();
  if(!h.startsWith("tree-")) scrollTo(0,0);
}
addEventListener("hashchange",route); route();
</script>

</body></html>
